<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AirportLounges.ca">
  <title>AirportLounges.ca</title>
  <!-- Gold disc (color sampled from the source PNG: #fbbf24). -->
  <circle cx="32" cy="32" r="32" fill="#fbbf24"/>
  <!-- Navy airliner silhouette. Material Design "flight" path, which draws
       the plane pointing straight up in a 24x24 viewBox centered at (12,12).
       The transform chain (read right-to-left):
         translate(-12 -12)  → center the plane at origin for rotation
         scale(2.1)          → size it to ~42 units tall in our 64-unit canvas
         rotate(45)          → clockwise 45° so the nose points upper-right
         translate(32 32)    → move to the circle centre
       SVG applies transforms left-to-right in source order, which is the
       right-to-left mathematical order above. -->
  <path
    fill="#0b132b"
    transform="translate(32 32) rotate(45) scale(2.1) translate(-12 -12)"
    d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
</svg>
