<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AirportLounges.ca">
  <title>AirportLounges.ca</title>
  <!-- Navy brand square (rounded corners match the existing icon-192/512). -->
  <rect width="64" height="64" rx="10" fill="#0c2634"/>
  <!-- Gold monogram "AL" — thick strokes so it reads at 16px.
       Letterforms are drawn as a single <path> to minimise bytes. -->
  <g fill="#D4B06A">
    <!-- A: left leg, right leg, crossbar -->
    <path d="M9 50 L19 14 L25 14 L35 50 L29 50 L26.3 40 L17.7 40 L15 50 Z"/>
    <path d="M19.2 34 L24.8 34 L22 23.5 Z" fill="#0c2634"/>
    <!-- L: vertical + horizontal foot -->
    <path d="M39 14 L45 14 L45 44 L58 44 L58 50 L39 50 Z"/>
  </g>
</svg>
